<text x="1528" y="55" class="page-label" text-anchor="end">Method</text>

<nav class="controls" aria-label="Presentation pages">
  <button type="button" data-page="mission" aria-current="page">Delivery task</button>
  <button type="button" data-page="control">Planning and control</button>
  <button type="button" data-page="disturbances">Wind and model mismatch</button>
  <button type="button" data-page="hil">Hardware in the loop</button>
  <span class="keys" aria-hidden="true">← →</span>
  <button type="button" id="present" title="Full screen (F)">Present</button>
</nav>
<div id="notice" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const slides = Array.from(document.querySelectorAll('.slide'));
  const buttons = Array.from(document.querySelectorAll('[data-page]'));
  const names = ['Delivery task', 'Planning and control', 'Wind and model mismatch', 'Hardware in the loop'];
  let current = 0;

  function show(index) {
    current = Math.max(0, Math.min(slides.length - 1, index));
    slides.forEach((slide, i) => {
      slide.classList.toggle('active', i === current);
      slide.setAttribute('aria-hidden', String(i !== current));
    });
    buttons.forEach((button, i) => {
      if (i === current) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
    document.title = 'GPENMPC · ' + names[current];
  }

  async function fullscreen() {
    const notice = document.getElementById('notice');
    notice.textContent = '';
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (_) {
      notice.textContent = 'Use the browser full-screen command or maximize this window.';
    }
  }

  buttons.forEach((button, index) => button.addEventListener('click', () => show(index)));
  document.getElementById('present').addEventListener('click', fullscreen);
  document.addEventListener('keydown', event => {
    if (event.ctrlKey || event.altKey || event.metaKey) return;
    if (event.target && /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
    switch (event.key) {
      case 'ArrowRight': case 'PageDown':
        event.preventDefault(); show(current + 1); break;
      case 'ArrowLeft': case 'PageUp':
        event.preventDefault(); show(current - 1); break;
      case ' ':
        if (event.target && event.target.tagName === 'BUTTON') break;
        event.preventDefault(); show(current + 1); break;
      case 'Home': event.preventDefault(); show(0); break;
      case 'End': event.preventDefault(); show(slides.length - 1); break;
      case '1': case '2': case '3': case '4': show(Number(event.key) - 1); break;
      case 'f': case 'F': event.preventDefault(); fullscreen(); break;
    }
  });
  show(0);
})();
</script>
